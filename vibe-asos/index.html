<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#19494c">
<title>Vibe a sós · Teste</title>
<style>
:root{--green:#19494c;--cream:#f8f5f0;--copper:#ac7358;--line:#dce4de;font-family:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#edf1ee;color:#1d3938}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #d9af75;outline-offset:3px}
.controlbar{position:relative;z-index:10;max-width:1440px;margin:0 auto;min-height:82px;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.navigation,.modes{display:flex;align-items:center;gap:10px}
.navbutton,.modebutton{border:1px solid #d1dcd6;color:#254641;background:white;border-radius:12px;padding:12px 16px;font-size:13px;font-weight:700}
.navbutton:hover,.modebutton:hover{background:#f3f8f5}
.modebutton.selected{background:#19494c;color:white;border-color:#19494c}
.counter{text-align:center;min-width:115px;line-height:1.35}
.counter strong{display:block;font-size:16px;letter-spacing:.09em}
.counter small{font-size:11px;color:#68817a;font-weight:700}
.stage-wrap{margin:0 auto 30px;max-width:1440px;padding:0 22px}
.stage-outer{border:1px solid #d5dfd9;background:#e4ece8;border-radius:18px;padding:13px;box-shadow:0 20px 50px #1c3c3510;transition:width .4s ease,background .4s ease;overflow:hidden}
.stage-outer.mobile{width:min(420px,100%);margin:0 auto;border-radius:35px;padding:12px;background:#1b3132;box-shadow:0 22px 50px #19312d35}
.phone-notch{display:none}
.stage-outer.mobile .phone-notch{width:78px;height:6px;border-radius:20px;background:#596966;display:block;margin:2px auto 12px}
.site{--surface:#fff;--letter:#19494c;--flower:#ac7358;--shine:#fff0b8;--paper:#f9f6f0;--nav:#19494c;--muted:#d3a77a;position:relative;min-height:630px;overflow:hidden;border-radius:8px;background:var(--paper)}
.stage-outer.mobile .site{border-radius:19px;min-height:710px}
.strip{height:26px;background:#f2f0eb}
.header{height:138px;display:flex;align-items:center;justify-content:center;background:var(--surface);border-bottom:1px solid rgba(0,0,0,.055)}
.header .logo{width:300px}
.navline{height:44px;background:var(--nav);display:flex;justify-content:center;align-items:center;gap:20px}
.navline i{display:block;height:1px;width:56px;background:#d9b98b77}
.navline b{display:block;color:#d9b98b;font-size:10px;font-weight:400}
.hero{min-height:510px;display:grid;grid-template-columns:57% 43%;background:var(--surface)}
.hero-core{position:relative;display:flex;justify-content:center;align-items:center;padding:45px 28px;background:radial-gradient(ellipse 55% 37% at 48% 47%,#d7ab6840,transparent 77%),var(--surface);overflow:hidden}
.hero-core:before{content:"";pointer-events:none;position:absolute;inset:14% 18%;border-radius:50%;border:1px solid #d8b07840;filter:blur(1px)}
.hero-core:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 29%,#fff9dc1c 47%,transparent 60%);pointer-events:none}
.hero .logo{width:min(100%,700px)}
.photo{height:100%;min-height:510px;position:relative;background:#d7c5b6;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;display:block}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#173c3c13,transparent 45%)}
.logo{position:relative;display:block;aspect-ratio:900/386;isolation:isolate;--letter-mask:url("assets/letras-c.png");--flower-mask:url("assets/flor-c-original.png")}
.letters,.flower,.luminous,.flower-luminous{position:absolute;inset:0;mask-position:center;-webkit-mask-position:center;mask-size:100% 100%;-webkit-mask-size:100% 100%;mask-repeat:no-repeat;-webkit-mask-repeat:no-repeat}
.letters{background:var(--letter);mask-image:var(--letter-mask);-webkit-mask-image:var(--letter-mask)}
.flower{background:var(--flower);mask-image:var(--flower-mask);-webkit-mask-image:var(--flower-mask);filter:drop-shadow(0 0 5px #d6a76d50)}
.luminous{mask-image:var(--letter-mask);-webkit-mask-image:var(--letter-mask);background:linear-gradient(102deg,transparent 24%,var(--shine) 47%,#fffdfa 50%,transparent 70%);background-size:300% 100%;animation:sweep 5.8s ease-in-out 2s infinite;mix-blend-mode:screen;opacity:.85}
.flower-luminous{mask-image:var(--flower-mask);-webkit-mask-image:var(--flower-mask);background:linear-gradient(100deg,transparent 20%,#fff1c3 49%,#fffdfa 52%,transparent 75%);background-size:290% 100%;animation:sweep 5.5s ease-in-out 2.2s infinite;mix-blend-mode:screen}
.hero .letters{animation:reveal 1.4s cubic-bezier(.23,.76,.33,1) both}
.hero .flower{animation:blossom 1.65s cubic-bezier(.17,.7,.32,1) .15s both}
.spark{position:absolute;pointer-events:none;width:8px;height:17px;background:linear-gradient(#ffe7b3,var(--flower));border-radius:85% 5% 85% 5%;filter:drop-shadow(0 0 8px #d9af75b0);opacity:0;animation:float 6.2s ease-in-out infinite}
.spark.a{left:44%;top:34%;--mx:-80px;--my:-65px;animation-delay:1s}
.spark.b{left:56%;top:34%;--mx:82px;--my:-95px;animation-delay:2.7s}
.spark.c{left:49%;top:26%;--mx:20px;--my:-110px;animation-delay:4.1s}
.spark.d{left:58%;top:45%;--mx:95px;--my:-20px;animation-delay:5.2s}
@keyframes sweep{0%,20%{background-position:125% 0;opacity:0}30%{opacity:.95}60%{background-position:-125% 0;opacity:.84}70%,100%{background-position:-125% 0;opacity:0}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0);opacity:.24}to{clip-path:inset(0 0 0 0);opacity:1}}
@keyframes blossom{0%{opacity:0;clip-path:circle(1% at 49% 53%);transform:scale(.93)}54%{opacity:.85;clip-path:circle(24% at 49% 43%)}100%{opacity:1;clip-path:circle(100% at 49% 43%);transform:scale(1)}}
@keyframes float{0%,7%{opacity:0;transform:translate(0,20px) rotate(-25deg) scale(.5)}24%{opacity:.78}68%{opacity:.7}100%{opacity:0;transform:translate(var(--mx),var(--my)) rotate(180deg) scale(.6)}}
.stage-outer.mobile .header{height:107px}
.stage-outer.mobile .header .logo{width:215px}
.stage-outer.mobile .navline{height:35px}
.stage-outer.mobile .navline i{width:27px}
.stage-outer.mobile .hero{display:flex;flex-direction:column;min-height:0}
.stage-outer.mobile .hero-core{min-height:300px;padding:22px 15px}
.stage-outer.mobile .hero .logo{width:100%}
.stage-outer.mobile .photo{height:310px;min-height:310px}
.stage-outer.mobile .strip{height:18px}
@media(max-width:790px){.controlbar{justify-content:center}.stage-wrap{padding:0 9px}.navbutton,.modebutton{padding:10px 11px;font-size:12px}.stage-outer{padding:8px}.header{height:110px}.header .logo{width:235px}.hero{grid-template-columns:1fr}.hero-core{min-height:360px}.photo{height:330px;min-height:330px}}
@media(max-width:440px){.controlbar{padding:12px 7px;gap:10px}.counter{min-width:95px}.counter strong{font-size:13px}.stage-outer.mobile{padding:9px}.stage-wrap{padding:0 7px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* Ajuste de aprovação: uma única assinatura, localizada somente no topo. */
.header{height:174px;position:relative;z-index:5;overflow:visible;isolation:isolate}
.header .logo{width:min(430px,76%);z-index:2}
.header .letters{animation:reveal 1.6s cubic-bezier(.22,.76,.32,1) both}
.header .flower{animation:blossom 1.7s cubic-bezier(.17,.7,.32,1) .28s both;filter:drop-shadow(0 0 9px #d6a76d6a)}
.header .luminous{animation:sweep 5.8s ease-in-out 1.4s infinite}
.header .flower-luminous{animation:sweep 4.8s ease-in-out 1.7s infinite}
.navline{position:relative;z-index:2}
.hero{position:relative;z-index:1}
.hero-core{padding:58px clamp(26px,6vw,100px);justify-content:flex-start;overflow:visible;background:radial-gradient(ellipse 80% 70% at 50% 55%,#d7ab681c,transparent 80%),var(--surface)}
.hero-core:before{display:none}
.hero-core:after{opacity:.32}
.hero-copy{max-width:570px;position:relative;z-index:1}
.hero-eyebrow{color:var(--flower);font-size:11px;letter-spacing:.25em;font-weight:700}
.hero-eyebrow b{font-weight:400;padding-left:9px}
.hero-copy h1{font:400 clamp(46px,5vw,77px)/1.06 Georgia,'Times New Roman',serif;letter-spacing:-.048em;color:var(--hero-ink,#19494c);margin:22px 0}
.hero-copy h1 em{font-weight:400;color:var(--hero-emphasis,#ac7358)}
.hero-copy p{font:400 clamp(13px,1.3vw,17px)/1.9 'Segoe UI',Arial,sans-serif;color:var(--hero-muted,#506660);max-width:390px;margin:0}
.hero-underline{margin-top:42px;width:160px;height:1px;background:linear-gradient(90deg,var(--flower),transparent)}
/* Pétalas de outono: partem do topo, oscilam lateralmente e caem. */
.autumn-leaves{position:absolute;top:33px;left:50%;width:min(520px,96%);height:360px;transform:translateX(-50%);z-index:3;pointer-events:none;overflow:visible}
.autumn-leaf{position:absolute;top:22%;left:var(--x);width:var(--w);height:var(--h);background:linear-gradient(135deg,#ffdfa0 0%,var(--flower) 48%,#b77843 100%);border-radius:94% 3% 87% 9%;opacity:0;filter:drop-shadow(0 0 4px #d6a76d80);transform-origin:50% 70%;will-change:transform,opacity;animation:autumn-fall var(--dur) cubic-bezier(.25,.15,.65,.9) var(--delay) infinite}
@keyframes autumn-fall{
  0%{opacity:0;transform:translate3d(0,-15px,0) rotate(-30deg) scale(.48)}
  10%{opacity:.95}
  32%{transform:translate3d(calc(var(--dx) * -.25),95px,0) rotate(100deg) scale(.92)}
  63%{opacity:.84;transform:translate3d(calc(var(--dx) * .68),210px,0) rotate(220deg) scale(.85)}
  100%{opacity:0;transform:translate3d(var(--dx),var(--dy),0) rotate(415deg) scale(.7)}
}
.stage-outer.mobile .header{height:126px}
.stage-outer.mobile .header .logo{width:260px;max-width:85%}
.stage-outer.mobile .autumn-leaves{width:290px;top:18px;height:305px}
.stage-outer.mobile .autumn-leaf{animation-duration:calc(var(--dur) * .85)}
.stage-outer.mobile .hero-core{min-height:350px;padding:45px 27px}
.stage-outer.mobile .hero-copy h1{font-size:50px}
.stage-outer.mobile .hero-copy p{font-size:13px}
@media(max-width:790px){
  .header{height:135px}
  .header .logo{width:min(300px,83%)}
  .autumn-leaves{top:20px;width:min(350px,90%)}
  .hero-core{min-height:370px;padding:42px 28px}
  .hero-copy h1{font-size:clamp(40px,9vw,62px)}
}
@media(prefers-reduced-motion:reduce){.autumn-leaf{display:none!important}}


/* Comparação simples para cliente: modelo, cor e efeito independentes. */
.option-grid{max-width:1440px;margin:16px auto 0;padding:0 22px;display:grid;grid-template-columns:1fr 1.5fr 1.35fr;gap:12px}
.option-box{background:#fff;border:1px solid #dce5df;border-radius:16px;padding:12px 14px;min-width:0;box-shadow:0 7px 24px rgba(24,54,48,.035)}
.option-heading{font:700 10px/1.1 Arial,sans-serif;color:#687f77;letter-spacing:.18em;display:block;margin:0 0 10px}
.choice-row{display:flex;gap:7px;flex-wrap:wrap}
.choice-button{border:1px solid #d2ddd6;border-radius:10px;background:#fdfefd;color:#2c504b;min-height:38px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;transition:background .2s,border-color .2s}
.choice-button:hover{border-color:#93b0a5;background:#f6faf7}
.choice-button.selected{border-color:#19494c;background:#19494c;color:#fff}
.option-grid + .controlbar{min-height:62px;padding-top:8px;padding-bottom:9px}
.logo .luminous,.logo .flower-luminous{will-change:background-position,opacity}
.site.fx-e1 .autumn-leaves{display:none}
.site.fx-e1 .header .letters{animation:reveal 1.4s ease both}
.site.fx-e1 .header .flower{animation:flowerFade 1.35s ease-out .25s both}
.site.fx-e1 .header .luminous{animation:sweep 5s ease-in-out 1.35s infinite}
.site.fx-e1 .header .flower-luminous{animation:sweep 4.6s ease-in-out 1.7s infinite}
/* E02: pétalas voam primeiro e a flor ilumina progressivamente. */
.site.fx-e2 .header .letters{animation:reveal 1.8s cubic-bezier(.23,.75,.32,1) both}
.site.fx-e2 .header .flower{animation:flowerReveal 2.15s cubic-bezier(.19,.74,.28,1) .15s both}
.site.fx-e2 .header .flower-luminous{animation:flowerBright 5.4s ease-in-out 1.25s infinite}
.site.fx-e2 .header .luminous{animation:sweep 5.4s ease-in-out 1.7s infinite}
.site.fx-e2 .autumn-leaf{animation-name:autumn-fall}
/* E03: brilho desliza na escrita e corre pelo sublinhado. */
.site.fx-e3 .autumn-leaves{display:none}
.site.fx-e3 .header .letters{animation:reveal 1.35s ease-out both}
.site.fx-e3 .header .flower{animation:flowerFade 1.15s ease-out .2s both}
.site.fx-e3 .header .luminous{animation:lineRush 5.3s cubic-bezier(.32,.35,.65,.9) 1s infinite}
.site.fx-e3 .header .flower-luminous{animation:lineRush 5.3s cubic-bezier(.32,.35,.65,.9) 1.35s infinite}
.site.fx-e3 .hero-underline{height:2px;width:200px;background:linear-gradient(90deg,transparent,var(--flower),#fff6d6,var(--flower),transparent);background-size:240% 100%;animation:underlineRush 3.6s ease-in-out infinite}
/* E04: cobre/dourado respirando, pétalas lentas e reflexo duplo. */
.site.fx-e4 .header .letters{animation:reveal 1.7s ease-out both}
.site.fx-e4 .header .flower{animation:flowerFade 1.4s ease-out .25s both,flowerGlow 5.8s ease-in-out 1.5s infinite}
.site.fx-e4 .header .luminous{animation:twoShines 6.4s ease-in-out 1.2s infinite}
.site.fx-e4 .header .flower-luminous{animation:twoShines 6.4s ease-in-out 1.6s infinite}
.site.fx-e4 .autumn-leaf{animation-duration:calc(var(--dur) * 1.25)}
@keyframes flowerFade{0%{opacity:0;filter:drop-shadow(0 0 1px transparent)}100%{opacity:1;filter:drop-shadow(0 0 6px #d6a76d55)}}
@keyframes flowerReveal{0%{opacity:0;clip-path:circle(1% at 50% 44%)}47%{opacity:.7;clip-path:circle(20% at 50% 44%)}100%{opacity:1;clip-path:circle(100% at 50% 44%)}}
@keyframes flowerBright{0%,20%,100%{opacity:0;background-position:120% 0}38%{opacity:.96}58%{opacity:.9;background-position:-125% 0}77%{opacity:0;background-position:-125% 0}}
@keyframes lineRush{0%,15%{opacity:0;background-position:125% 0}30%{opacity:1}65%{opacity:.93;background-position:-120% 0}75%,100%{opacity:0;background-position:-120% 0}}
@keyframes underlineRush{0%,100%{background-position:125% 0;opacity:.2}55%{background-position:-125% 0;opacity:1}}
@keyframes flowerGlow{0%,100%{filter:drop-shadow(0 0 2px #d6a76d44)}50%{filter:drop-shadow(0 0 11px #d6a76da0)}}
@keyframes twoShines{0%,8%{opacity:0;background-position:125% 0}20%{opacity:.95}34%{opacity:.7;background-position:-120% 0}49%{opacity:0;background-position:125% 0}60%{opacity:.94}82%{opacity:.86;background-position:-120% 0}95%,100%{opacity:0;background-position:-120% 0}}
@media(max-width:1024px){.option-grid{grid-template-columns:1fr 1fr}.option-box:last-child{grid-column:span 2}}
@media(max-width:600px){.option-grid{padding:0 10px;gap:9px;grid-template-columns:1fr}.option-box:last-child{grid-column:span 1}.choice-button{padding:8px 9px;font-size:11px}}
@media(prefers-reduced-motion:reduce){.site.fx-e2 .autumn-leaf,.site.fx-e4 .autumn-leaf{display:none!important}.site .logo *{animation:none!important}}

</style>
</head>

<section class="option-grid" aria-label="Personalizar visualização">
  <div class="option-box"><span class="option-heading">MODELO</span><div class="choice-row" id="models"></div></div>

<div class="controlbar">
 <div class="navigation"><button class="navbutton" id="prev" aria-label="Tela anterior">←</button><div class="counter" aria-live="polite"><strong id="code">C-01 · V01</strong><small id="number">01 / 24</small></div><button class="navbutton" id="next" aria-label="Próxima tela">→</button></div>

 <header class="header" aria-label="Assinatura Vibe a sós"><div class="logo" role="img" aria-label="Vibe a sós, assinatura C com flor de lótus"><span class="letters"></span><span class="flower"></span><span class="luminous"></span><span class="flower-luminous"></span></div><div class="autumn-leaves" aria-hidden="true"><span class="autumn-leaf" style="--x:48%;--dx:-164px;--dy:320px;--delay:-2.4s;--dur:7.8s;--w:10px;--h:17px" aria-hidden="true"></span><span class="autumn-leaf" style="--x:53%;--dx:117px;--dy:296px;--delay:-6.1s;--dur:8.3s;--w:9px;--h:18px" aria-hidden="true"></span><span class="autumn-leaf" style="--x:43%;--dx:-112px;--dy:348px;--delay:-4s;--dur:9.2s;--w:9px;--h:16px" aria-hidden="true"></span><span class="autumn-leaf" style="--x:56%;--dx:169px;--dy:313px;--delay:-1.8s;--dur:8.7s;--w:11px;--h:21px" aria-hidden="true"></span><span class="autumn-leaf" style="--x:50%;--dx:58px;--dy:390px;--delay:-8.3s;--dur:9.7s;--w:8px;--h:16px" aria-hidden="true"></span><span class="autumn-leaf" style="--x:46%;--dx:-75px;--dy:276px;--delay:-0.8s;--dur:7.4s;--w:9px;--h:15px" aria-hidden="true"></span><span class="autumn-leaf" style="--x:54%;--dx:93px;--dy:350px;--delay:-5.5s;--dur:8.9s;--w:8px;--h:14px" aria-hidden="true"></span><span class="autumn-leaf" style="--x:49%;--dx:-148px;--dy:355px;--delay:-3s;--dur:9.3s;--w:12px;--h:20px" aria-hidden="true"></span><span class="autumn-leaf" style="--x:45%;--dx:42px;--dy:297px;--delay:-7.4s;--dur:8.1s;--w:10px;--h:18px" aria-hidden="true"></span><span class="autumn-leaf" style="--x:55%;--dx:-44px;--dy:338px;--delay:-0.1s;--dur:8.5s;--w:9px;--h:17px" aria-hidden="true"></span><span class="autumn-leaf" style="--x:51%;--dx:161px;--dy:371px;--delay:-4.8s;--dur:10.1s;--w:11px;--h:20px" aria-hidden="true"></span><span class="autumn-leaf" style="--x:47%;--dx:-84px;--dy:325px;--delay:-2.9s;--dur:7.9s;--w:8px;--h:15px" aria-hidden="true"></span></div></header>

<script>
(function(){
 var colors=[
 {id:'v01',s:'#ffffff',l:'#19494c',f:'#ac7358',n:'#19494c',shine:'#ffe4b4'},
 {id:'v02',s:'#ffffff',l:'#19494c',f:'#d6aa68',n:'#19494c',shine:'#fff1c4'},
 {id:'v03',s:'#19494c',l:'#f6e9d6',f:'#d9ad65',n:'#102f32',shine:'#fffad7'},
 {id:'v04',s:'#19494c',l:'#ffffff',f:'#ffffff',n:'#113739',shine:'#ffffff'},
 {id:'v05',s:'#ffffff',l:'#181918',f:'#181918',n:'#19494c',shine:'#fff4dd'},
 {id:'v06',s:'#ffffff',l:'#181918',f:'#ac7358',n:'#19494c',shine:'#fff2bc'},
 {id:'v07',s:'#fffaf5',l:'#a77156',f:'#a77156',n:'#19494c',shine:'#ffe4b2'},
 {id:'v08',s:'#f7f5ef',l:'#19494c',f:'#19494c',n:'#19494c',shine:'#e8f5ec'}
 ];
 var flowers=['assets/flor-c-original.png','assets/flor-c-ampliada.png','assets/flor-c-petalas.png'];
 var query=new URLSearchParams(location.search);
 var mi=Math.max(0,['c1','c2','c3'].indexOf(query.get('modelo')));
 var ci=Math.max(0,colors.findIndex(function(c){return c.id===query.get('cor');}));
 var idx=mi*8+ci;
 var effectId=query.get('efeito')||'e01';
 var effects=[{id:'e01',label:'E01 · Brilho'},{id:'e02',label:'E02 · Florescer'},{id:'e03',label:'E03 · Traços'},{id:'e04',label:'E04 · Pétalas'}];
 var effect=Math.max(0,effects.findIndex(function(x){return x.id===effectId;}));
 function makeChoices(rootId,entries,choose){
   var host=document.getElementById(rootId);
   entries.forEach(function(entry,i){
    var b=document.createElement('button');
    b.type='button'; b.className='choice-button';
    b.textContent=entry.label; b.dataset.pick=String(i);
    b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){choose(i); apply();});
    host.appendChild(b);
   });
 }
 function updateChoices(){
   var m=Math.floor(idx/8),c=idx%8;
   [['models',m],['colors',c],['effects',effect]].forEach(function(pair){
    document.querySelectorAll('#'+pair[0]+' .choice-button').forEach(function(btn,i){
      var yes=i===pair[1];btn.classList.toggle('selected',yes);btn.setAttribute('aria-pressed',String(yes));
    });
   });
 }
 var site=document.getElementById('site'),stage=document.getElementById('stage');
 function apply(){
  var model=Math.floor(idx/8),color=colors[idx%8];
  site.classList.remove('fx-e1','fx-e2','fx-e3','fx-e4');
  site.classList.add('fx-'+effects[effect].id);
  updateChoices();
  site.style.setProperty('--surface',color.s);
  site.style.setProperty('--letter',color.l);
  site.style.setProperty('--flower',color.f);
  site.style.setProperty('--nav',color.n);
  site.style.setProperty('--shine',color.shine);
  var dark=color.s.toLowerCase()==='#19494c';
  site.style.setProperty('--hero-ink',dark?'#faf4e9':'#19494c');
  site.style.setProperty('--hero-muted',dark?'#eee2d4':'#526863');
  site.style.setProperty('--hero-emphasis',dark?'#e5be82':color.f);
  document.querySelectorAll('.logo').forEach(function(el){
   el.style.setProperty('--flower-mask','url("'+flowers[model]+'")');
  });
  document.getElementById('code').textContent='C-0'+(model+1)+' · '+color.id.toUpperCase()+' · '+effects[effect].id.toUpperCase();
  document.getElementById('number').textContent=String(idx+1).padStart(2,'0')+' / 24';
  var url=new URL(location.href);
  url.searchParams.set('modelo','c'+(model+1));
  url.searchParams.set('cor',color.id);
  url.searchParams.set('efeito',effects[effect].id);
  history.replaceState({},'',url);
  site.querySelectorAll('.header .letters,.header .flower,.header .luminous,.header .flower-luminous,.autumn-leaf').forEach(function(el){
   el.style.animation='none';void el.offsetWidth;el.style.animation='';
  });
 }
 document.getElementById('prev').addEventListener('click',function(){idx=(idx+23)%24;apply();});
 document.getElementById('next').addEventListener('click',function(){idx=(idx+1)%24;apply();});
 document.querySelectorAll('[data-device]').forEach(function(button){
  button.addEventListener('click',function(){
   var mobile=button.dataset.device==='mobile';
   stage.classList.toggle('mobile',mobile);
   document.querySelectorAll('[data-device]').forEach(function(b){b.classList.toggle('selected',b===button);});
  });
 });
 document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){idx=(idx+1)%24;apply();}
  if(e.key==='ArrowLeft'){idx=(idx+23)%24;apply();}
 });
 makeChoices('models',[{label:'C-01 · Original'},{label:'C-02 · Maior'},{label:'C-03 · Aberta'}],function(i){idx=i*8+(idx%8);});
 makeChoices('colors',colors.map(function(x){return {label:x.id.toUpperCase()};}),function(i){idx=Math.floor(idx/8)*8+i;});
 makeChoices('effects',effects,function(i){effect=i;});
 apply();
})();
</script>
</body>
</html>
